<!DOCTYPE html>
<html>
<head>
    <title>Ghibli Vibe Machine</title>
    <style>
        body {

  background: #121212;

  display: flex;

  justify-content: center;

  align-items: center;

  height: 100vh;

  margin: 0;

  font-family: sans-serif;

}

#app {

  background: rgba(255, 255, 255, 0.1);

  backdrop-filter: blur(10px);

  padding: 30px;

  border-radius: 20px;

  text-align: center;

  color: white;

  width: 80%;

}

button {

  background: #ff4757;

  border: none;

  padding: 15px 30px;

  border-radius: 50px;

  color: white;

  font-weight: bold;

}

img {

  animation: fadeIn 1.5s ease;

}

@keyframes fadeIn {

  from { opacity: 0; transform: translateY(10px); }

  to { opacity: 1; transform: translateY(0); }

}
    </style>
</head>
<body>
    <script>
        async function generateVibe() {
  const quoteElement = document.getElementById('quote');
  const titleElement = document.getElementById('title');
  quoteElement.innerText = "The Cat Bus is arriving...";

  try {
    // 1. Fetch all films
    const response = await fetch('https://ghibliapi.vercel.app/films');
    const films = await response.json();

    // 2. Pick a random film
    const movie = films[Math.floor(Math.random() * films.length)];

    // 3. Update the UI with Movie Info
    titleElement.innerText = movie.title;
    // 1. Grab the trailer link element

const trailerLink = document.getElementById('trailer-btn');

// 2. Create a YouTube search URL using the movie title

const searchQuery = encodeURIComponent(`${movie.title} official trailer`);

trailerLink.href = `https://www.youtube.com/results?search_query=${searchQuery}`;

// 3. Make the button visible now that we have a title

trailerLink.style.display = "inline-block";
    quoteElement.innerHTML = `
      <img src="${movie.image}" style="width:100%; border-radius:10px; margin-bottom:15px;">
      <p><em>${movie.description.substring(0, 150)}...</em></p>
      <p><strong>Released:</strong> ${movie.release_date}</p>
    `;

    // 4. Change background to a soft Ghibli-esque color
    document.body.style.background = `hsl(${Math.random() * 360}, 30%, 50%)`;

  } catch (error) {
    quoteElement.innerText = "Spirit world blocked the connection. Check your internet!";
    console.error(error);
  }
}
        generateVibe(); // Make sure this is at the bottom!
    </script>
</body>
</html>
